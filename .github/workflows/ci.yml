name: Build Debian package

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - run: cargo test --locked
      - run: ./packaging/build-deb.sh
      - run: dpkg-deb --info dist/*.deb && dpkg-deb --contents dist/*.deb
      - run: sudo sh tests/wg-quick-control.sh dist/*.deb
      - uses: actions/upload-artifact@v7
        with:
          path: dist/*.deb
          archive: false
          if-no-files-found: error
