[package]
name = "wireceptor"
version = "2.0.0"
edition = "2021"
rust-version = "1.90"
license = "MIT"
description = "WireGuard panel indicator for Linux"

[dependencies]
ksni = { version = "0.3.7", default-features = false, features = ["blocking", "async-io"] }
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
